<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 뷰포트 확인용 (390px)</title>
<style>
  body{margin:0;background:#2b3440;display:flex;gap:12px;padding:12px;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;align-items:flex-start}
  .dev{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px #7f8c9b}
  .cap{color:#fff;font-size:11px;padding:4px 6px;background:#1b232c}
  iframe{border:0;display:block;width:390px;height:844px}
</style>
</head>
<body>
  <div class="dev">
    <div class="cap">iPhone 390×844 — BNK 기업·여신분석 (캐시 무효화 로드)</div>
    <iframe id="f" src="about:blank" width="390" height="844" title="app"></iframe>
  </div>
  <div class="dev">
    <div class="cap">390×1700 (스크롤 없이 전체 확인용)</div>
    <iframe id="g" src="about:blank" width="390" height="1700" title="app-tall"></iframe>
  </div>
  <script>
    document.getElementById('f').src = './index.html?v=' + Date.now();
    document.getElementById('g').src = './index.html?v=' + Date.now();
  </script>
</body>
</html>
